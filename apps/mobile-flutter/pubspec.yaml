  connectivity_plus: ^6.1.1
  provider: ^6.1.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
