name: Windows Electron (instalador web + completo + MSI + ZIP)

# Cliente Windows = o MESMO app Electron do macOS (UI web + offline-first).
# O build e a verificação vivem em win-electron-build.yml (reutilizável, também
# usado por desktop-release.yml). Aqui ficam só o gatilho e a publicação.
# A publicação só acontece (a) por tag desktop-electron/v*, ou (b) por disparo
# manual a partir de main com `publish: true` e um mufutu_ref FIXO (SHA ou tag),
# e em ambos só se o smoke passar. (b) existe porque nem sempre é possível
# empurrar a tag v<versão> para o repo privado; o build é igualmente reprodutível.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão semver (vazio = a do apps/electron/package.json)'
        required: false
        default: ''
      mufutu_ref:
        description: 'Ref do repo mufutu a compilar (branch/tag/SHA)'
        required: false
        default: 'main'
      publish:
        description: 'Publicar a release se o smoke passar (só a partir de main, com mufutu_ref fixo)'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'desktop-electron/v*'

# `actions: read` é para o smoke (workflow chamado): um workflow chamado só pode
# ter permissões iguais ou INFERIORES às do chamador, e o smoke descarrega o
# artefacto por API (também de um run anterior). Sem isto o run morre em
# `startup_failure` ao fim de 1 segundo, sem nenhum job a arrancar.
permissions:
  contents: write
  actions: read

jobs:
  resolve:
    name: Resolver versão e ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      mufutu_ref: ${{ steps.r.outputs.mufutu_ref }}
    steps:
      - id: r
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^desktop-electron/v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            # Release por tag: compila a tag v<versão> do mufutu — reprodutível.
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "mufutu_ref=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            REF="${{ github.event.inputs.mufutu_ref || 'main' }}"
            if [[ "${{ github.event.inputs.publish }}" == "true" ]]; then
              # Uma release não pode sair de «main», que se mexe: sem ref fixo
              # dois builds da «mesma» versão podiam ser código diferente.
              [[ "$REF" =~ ^[0-9a-f]{40}$ || "$REF" =~ ^v[0-9] ]] \
                || { echo "::error::publish=true exige mufutu_ref fixo (SHA de 40 caracteres ou tag v*), recebi «$REF»."; exit 1; }
              [[ -n "${{ github.event.inputs.version }}" ]] \
                || { echo "::error::publish=true exige a versão explícita."; exit 1; }
            fi
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "mufutu_ref=${REF}" >> "$GITHUB_OUTPUT"
          fi

  win:
    name: Windows
    needs: resolve
    uses: ./.github/workflows/win-electron-build.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      mufutu_ref: ${{ needs.resolve.outputs.mufutu_ref }}
    secrets: inherit

  publish:
    name: Publicar em mufutusoftware
    needs: [resolve, win]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/desktop-electron/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mufutu-electron-win
          path: release-assets

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A versão efectivamente compilada (tag ou input) — não se deduz do nome do ref.
          VERSION="${{ needs.win.outputs.version }}"
          [[ -n "$VERSION" ]] || { echo "::error::versão compilada desconhecida"; exit 1; }
          # Os artefactos ficam em release-assets/dist (upload da pasta win/**).
          DIR="release-assets"
          [[ -d "release-assets/dist" ]] && DIR="release-assets/dist"

          # Guardrail anti-colisão: nunca substituir às cegas um asset já
          # publicado — foi assim que uma 1.0.41 renomeada se fez passar por
          # 1.0.44. Re-publicação consciente: apagar o asset primeiro.
          PUBLISHED="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          for asset in "MUFUTU-Web-Setup-${VERSION}.exe" "mufutu-${VERSION}-x64.nsis.7z" "MUFUTU-Setup-${VERSION}-x64.exe" "MUFUTU-${VERSION}-x64.msi"; do
            if grep -qx "$asset" <<< "$PUBLISHED"; then
              echo "::error::${asset} já existe na release v${VERSION}. Apague o asset primeiro se quer re-publicar."
              exit 1
            fi
          done

          chmod +x scripts/publish-release.sh
          bash scripts/publish-release.sh "$VERSION" "$DIR"
