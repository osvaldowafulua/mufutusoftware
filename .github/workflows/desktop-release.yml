name: Desktop Release (macOS + Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão semver (ex: 1.0.1)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'desktop/v*'

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '22'

jobs:
  resolve:
    name: Resolver versão e ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      mufutu_ref: ${{ steps.r.outputs.mufutu_ref }}
    steps:
      - id: r
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^desktop/v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            # A tag aqui é desktop/v<versão>; no repo mufutu é v<versão>.
            echo "mufutu_ref=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "mufutu_ref=main" >> "$GITHUB_OUTPUT"
          fi

  mac:
    name: macOS DMG + ZIP
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout CMMS (mufutu — ref fixo)
        uses: actions/checkout@v4
        with:
          repository: osvaldowafulua/mufutu
          path: mufutu
          # Ref fixo: sem isto o macOS saía do HEAD do main no instante do
          # build e o Windows da tag — duas releases diferentes com a mesma
          # versão. O mesmo problema já tinha sido corrigido no pipeline
          # Electron Windows.
          ref: ${{ needs.resolve.outputs.mufutu_ref }}
          token: ${{ secrets.MUFUTU_CMMS_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          chmod +x mufutu/apps/desktop-mac/scripts/import-apple-cert.sh
          mufutu/apps/desktop-mac/scripts/import-apple-cert.sh

      - name: Package macOS
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x mufutu/apps/desktop-mac/scripts/*.sh
          mufutu/apps/desktop-mac/scripts/package.sh "${{ needs.resolve.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-assets
          path: |
            mufutu/apps/desktop-mac/artifacts/dist/**
          retention-days: 30

  # O cliente Windows é o app Electron — o MESMO do macOS. Este job compilava
  # apps/desktop-win (WPF legado) e o package.ps1 escrevia-o com os nomes do
  # Electron (MUFUTU-Setup-<v>-x64.exe, MUFUTU-<v>-x64.msi); como o upload é
  # feito com --clobber, era o WPF que acabava publicado como «Windows» desta
  # release. O MUFUTU-Setup-1.0.49-x64.exe publicado é um bootstrapper WiX
  # Burn, sem um símbolo de NSIS ou Electron. Daí o .exe e o .msi nunca
  # funcionarem e só o ZIP (que o WPF não produz) servir.
  win:
    name: Windows
    needs: resolve
    uses: ./.github/workflows/win-electron-build.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      mufutu_ref: ${{ needs.resolve.outputs.mufutu_ref }}
    secrets: inherit

  release:
    name: GitHub Release
    needs: [resolve, mac, win]
    runs-on: ubuntu-latest
    # SÓ com tag: um workflow_dispatch é um build de teste e não pode publicar
    # release real (esta condição já quase publicou releases por engano).
    if: startsWith(github.ref, 'refs/tags/desktop/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-mac-assets
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: mufutu-electron-win
          path: release-assets
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish-mufutusoftware-release.sh
          VERSION="${{ needs.resolve.outputs.version }}"
          bash scripts/publish-mufutusoftware-release.sh "$VERSION" release-assets
