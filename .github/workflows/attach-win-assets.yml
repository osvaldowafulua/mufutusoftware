name: Anexar instaladores Windows a uma release

# Utilitário de recuperação: pega nos instaladores de um run (WPF ou Electron)
# e anexa-os (com --clobber) à release indicada.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID do run Actions com o artefacto'
        required: true
      tag:
        description: 'Tag da release destino (ex: v1.0.47)'
        required: true
      artifact_name:
        description: 'Nome do artefacto (mufutu-electron-win ou mufutu-desktop-installer)'
        required: false
        default: 'mufutu-electron-win'

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: assets

      - name: Anexar à release (substitui existentes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find assets -type f \( \
            -name 'MUFUTU-Setup-*.exe' -o \
            -name 'MUFUTU-*-win-*.zip' -o \
            -name 'MUFUTU-Setup-*.exe.blockmap' -o \
            -name 'latest.yml' -o \
            -name 'MUFUTU-CodeSign.cer' -o \
            -name 'MUFUTU-*.msi' \
          \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "Nenhum instalador encontrado no artefacto" >&2
            find assets -type f >&2
            exit 1
          fi
          echo "=== Ficheiros ==="
          printf '%s\n' "${FILES[@]}"

          # Guardrail: o MUFUTU-Setup-*.exe da release é o instalador NSIS do
          # app Electron. Este utilitário também aceita o artefacto do cliente
          # WPF legado, cujo Setup é um bootstrapper WiX Burn — anexá-lo com
          # --clobber substituía o app a sério (foi o que aconteceu até à
          # 1.0.49). Recusar antes de tocar na release.
          for f in "${FILES[@]}"; do
            case "$(basename "$f")" in
              MUFUTU-Setup-*.exe)
                if grep -qa '\.wixburn' "$f"; then
                  echo "::error::$(basename "$f") é um bootstrapper WiX Burn (cliente WPF legado), não o instalador NSIS do app Electron." >&2
                  exit 1
                fi
                if ! grep -qa 'Nullsoft' "$f"; then
                  echo "::error::$(basename "$f") não tem assinatura de NSIS — não é o instalador do app Electron." >&2
                  exit 1
                fi
                ;;
            esac
          done

          echo "=== SHA-256 ==="
          sha256sum "${FILES[@]}"
          gh release upload "${{ github.event.inputs.tag }}" "${FILES[@]}" \
            --repo "${{ github.repository }}" --clobber
          echo "=== assets finais ==="
          gh release view "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
