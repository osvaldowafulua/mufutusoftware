name: Windows Electron — build + smoke (reutilizável)

# Build e verificação do cliente Windows (app Electron, o MESMO do macOS).
# Workflow reutilizável: desktop-electron-win.yml e desktop-release.yml passam
# por aqui. Ter dois pipelines Windows separados foi o que deixou escapar,
# durante várias releases, o cliente WPF legado publicado com os nomes do
# Electron — qualquer pipeline que publique Windows chama este.
#
# O que sai (artefacto mufutu-electron-win):
#   MUFUTU-Web-Setup-<v>.exe        instalador web (~0,6 MB): descarrega o payload
#   mufutu-<v>-x64.nsis.7z          payload que o stub e o auto-update descarregam
#   latest.yml                      feed do electron-updater (traz `packages`)
#   MUFUTU-Setup-<v>-x64.exe        instalador completo, offline (outra construção)
#   MUFUTU-<v>-x64.msi              MSI completo para GPO/Intune
#   MUFUTU-<v>-win-x64.zip          portátil
#   ci-stub/                        só para o smoke; nunca é publicado

on:
  workflow_call:
    inputs:
      version:
        description: 'Versão semver (vazio = a do apps/electron/package.json)'
        required: false
        type: string
        default: ''
      mufutu_ref:
        description: 'Ref do repo mufutu a compilar (branch/tag/SHA)'
        required: false
        type: string
        default: 'main'
    outputs:
      version:
        description: 'Versão efectivamente compilada'
        value: ${{ jobs.build.outputs.version }}

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build (stub + payload + completo + MSI + ZIP)
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout CMMS (mufutu — privado, ref fixo)
        uses: actions/checkout@v4
        with:
          repository: osvaldowafulua/mufutu
          path: mufutu
          ref: ${{ inputs.mufutu_ref }}
          token: ${{ secrets.MUFUTU_CMMS_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./mufutu/apps/electron/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (package-win.sh)
        shell: bash
        env:
          WIN_CODESIGN_PFX: ${{ secrets.WIN_CODESIGN_PFX }}
          WIN_CODESIGN_PASSWORD: ${{ secrets.WIN_CODESIGN_PASSWORD }}
          # Constrói também um stub de CI com a URL do payload apontada ao
          # servidor local do smoke — o stub publicado tem a URL da release,
          # que ainda não existe durante o build.
          MUFUTU_CI_STUB_URL: http://127.0.0.1:18080
        run: |
          chmod +x mufutu/apps/desktop-mac/scripts/package-win.sh mufutu/apps/desktop-mac/scripts/verify-artifact.sh
          mufutu/apps/desktop-mac/scripts/package-win.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: mufutu-electron-win
          path: mufutu/apps/electron/artifacts/win/**
          retention-days: 30

  smoke:
    name: Smoke de instalação
    needs: build
    uses: ./.github/workflows/win-electron-smoke.yml
    permissions:
      contents: read
      actions: read
